<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>火星财务 · 设计审计</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 锁死外层溢出：html/body/#app 均 overflow:hidden，垂直滚动只存在于内部 .nav */
  html, body { height: 100%; overflow: hidden; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
  #app { display: flex; height: 100vh; overflow: hidden; }
  .sidebar { width: 244px; flex-shrink: 0; background: #1f2937; color: #e5e7eb; display: flex; flex-direction: column; overflow: hidden; }
  .topbar { display: flex; align-items: center; justify-content: space-between; }
  .sidebar h1 { font-size: 16px; padding: 18px 20px 6px; }
  .hamburger { display: none; align-items: center; justify-content: center; width: 52px; height: 52px; background: transparent; border: none; color: #e5e7eb; font-size: 22px; cursor: pointer; }
  .sidebar .sub { font-size: 12px; color: #9ca3af; padding: 0 20px 14px; line-height: 1.6; border-bottom: 1px solid #374151; }
  .nav { flex: 1; overflow-y: auto; padding: 8px 0; }
  .nav-item { padding: 13px 20px; cursor: pointer; border-left: 3px solid transparent; font-size: 14px; transition: background 0.12s; }
  .nav-item:hover { background: #374151; }
  .nav-item.active { background: #374151; border-left-color: #f59e0b; color: #fff; font-weight: 600; }
  .content { flex: 1; background: #fff; overflow: hidden; min-width: 0; }
  .content iframe { width: 100%; height: 100%; border: none; display: block; }
  .foot { font-size: 11px; color: #6b7280; padding: 10px 20px; border-top: 1px solid #374151; }

  /* 小屏：侧栏收到顶部，菜单收起为三明治下拉 */
  @media (max-width: 768px) {
    #app { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: column; }
    .topbar { width: 100%; }
    .sidebar h1 { padding: 14px 16px; flex: 1; }
    .hamburger { display: inline-flex; }
    .sidebar .sub { display: none; }
    .nav { display: none; flex: none; max-height: 60vh; border-bottom: 1px solid #374151; }
    .nav.open { display: block; }
    .sidebar .foot { display: none; }
    .content { flex: 1; min-height: 0; }
  }
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar">
    <div class="topbar">
      <h1>火星财务 · 设计审计</h1>
      <button class="hamburger" id="hamburger" aria-label="切换菜单">&#9776;</button>
    </div>
    <div class="sub">对外公开监督入口（临时）。点击下方文档，查看项目规划与设计。</div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">本入口为临时设计审计用途，正式上线后移除</div>
  </aside>
  <main class="content">
    <iframe id="frame" src="" title="设计文档"></iframe>
  </main>
</div>
<script>
  // 文档清单：按原始文档 CreationTime 升序；file 为 public/design-audit/ 下的同名 html
  const docs = [
    { file: '财务术语科普手册.html', name: '财务术语科普' },
    { file: '火星财务系统纪律红线.html', name: '纪律红线' },
    { file: '火星财务系统业务模型.html', name: '业务模型' },
    { file: '火星财务系统接口文档.html', name: '接口文档' },
    { file: '火星财务系统技术栈文档.html', name: '技术栈文档' }
  ];
  const nav = document.getElementById('nav');
  const frame = document.getElementById('frame');
  const hamburger = document.getElementById('hamburger');
  const isMobile = () => window.matchMedia('(max-width: 768px)').matches;
  hamburger.addEventListener('click', () => nav.classList.toggle('open'));
  docs.forEach((d, i) => {
    const el = document.createElement('div');
    el.className = 'nav-item' + (i === 0 ? ' active' : '');
    el.textContent = d.name;
    el.onclick = () => {
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      el.classList.add('active');
      frame.src = './' + encodeURI(d.file);
      if (isMobile()) nav.classList.remove('open');
    };
    nav.appendChild(el);
  });
  frame.src = './' + encodeURI(docs[0].file);
</script>
</body>
</html>
