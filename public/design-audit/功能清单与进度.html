<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>火星财务 · 功能清单与进度</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; color: #1f2937; padding: 24px; line-height: 1.5; }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #6b7280; font-size: 13px; margin-bottom: 18px; }
  .summary { background: #fff; border-radius: 12px; padding: 16px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
  .summary .row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .big { font-size: 26px; font-weight: 700; color: #2563eb; }
  .bar { flex: 1; min-width: 200px; height: 12px; background: #e5e7eb; border-radius: 6px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#2563eb,#3b82f6); transition: width .3s; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: #4b5563; margin-top: 10px; }
  .legend span { display: inline-flex; align-items: center; gap: 5px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .toolbar { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 14px; }
  .btn { font-size: 12px; padding: 6px 12px; border: 1px solid #d1d5db; background: #fff; border-radius: 6px; cursor: pointer; color: #374151; }
  .btn:hover { background: #f3f4f6; }
  .phase { background: #fff; border-radius: 12px; padding: 18px 20px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 16px; }
  .phase h2 { font-size: 16px; margin-bottom: 4px; }
  .phase .pmeta { font-size: 12px; color: #6b7280; margin-bottom: 12px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-top: 1px solid #f0f2f5; cursor: pointer; user-select: none; }
  .item:first-of-type { border-top: none; }
  .item:hover { background: #f8fafc; }
  .chk { width: 22px; height: 22px; border-radius: 6px; border: 2px solid #cbd5e1; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; transition: all .15s; }
  .item .name { font-size: 14px; font-weight: 600; flex: 1; }
  .item .apis { font-size: 12px; color: #9ca3af; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
  .s0 { background: #fee2e2; color: #b91c1c; }
  .s1 { background: #fef3c7; color: #b45309; }
  .s2 { background: #dcfce7; color: #15803d; }
  .chk.s0 { border-color: #cbd5e1; }
  .chk.s1 { background: #f59e0b; border-color: #f59e0b; }
  .chk.s2 { background: #22c55e; border-color: #22c55e; }
  .note { font-size: 11px; color: #9ca3af; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>火星财务 · 功能清单与进度</h1>
  <div class="sub">推进顺序按「先骨架、后闭环、再价值链、收尾运营」编排。完成一项，点该项勾一项（状态：待开发 → 进行中 → 已完成，循环切换）。勾选状态保存在本浏览器。</div>

  <div class="summary">
    <div class="row">
      <div><div class="big" id="doneCount">0 / 15</div><div style="font-size:12px;color:#6b7280">已完成模块</div></div>
      <div class="bar"><i id="barFill"></i></div>
      <div style="font-size:13px;color:#4b5563">约 95 个接口 / 15 模块</div>
    </div>
    <div class="legend">
      <span><i class="dot" style="background:#ef4444"></i>待开发</span>
      <span><i class="dot" style="background:#f59e0b"></i>进行中</span>
      <span><i class="dot" style="background:#22c55e"></i>已完成</span>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn" id="resetBtn">重置勾选</button>
  </div>

  <div id="phases"></div>

  <div class="note">本清单为开发期进度规划，随模块收口更新；与设计审计入口同为临时性质，正式上线后一并移除。</div>
</div>

<script>
  // 模块清单取自《火星财务系统接口文档 v1.0》的 15 个模块（12 业务 + 3 系统），按推进顺序分组
  const phases = [
    { key: '0', title: 'Phase 0 · 安全骨架（先收口）', desc: '横向基础设施，所有业务模块的前置依赖：认证(5) + RBAC(14) + 字典(5)', modules: [
      { name: '认证模块', apis: 5 },
      { name: 'RBAC 权限管理', apis: 14 },
      { name: '字典管理', apis: 5 }
    ]},
    { key: '1', title: 'Phase 1 · 第一个业务闭环', desc: '登录→建项→提交→经理批→立项生效，最小可演示纵向切片', modules: [
      { name: '项目立项', apis: 8 },
      { name: '货物明细', apis: 5 },
      { name: '审批管理（立项/发货）', apis: 5 }
    ]},
    { key: '2', title: 'Phase 2 · 履约与资金流', desc: '业务主价值链，带 Flowable 审批链', modules: [
      { name: '发货流程', apis: 7 },
      { name: '应收单', apis: 5 },
      { name: '收款流程', apis: 7 },
      { name: '开票流程', apis: 7 },
      { name: '核销机制', apis: 5 }
    ]},
    { key: '3', title: 'Phase 3 · 收尾与运营', desc: '边角功能与运营支撑', modules: [
      { name: '退货流程', apis: 6 },
      { name: '数据看板', apis: 4 },
      { name: '文件管理', apis: 5 },
      { name: '系统管理', apis: 7 }
    ]}
  ];
  const STATE = ['s0', 's1', 's2'];
  const STATE_TXT = ['待开发', '进行中', '已完成'];
  const STORE_KEY = 'firestar_checklist_state_v1';

  // 已完成模块的基线种子（代码已收口，运行时验证见本地 mvn/npm；localStorage 一旦写入即由用户状态覆盖）
  // 2026-10-21 同步：平台/基础设施类模块已随后端落地 —— 认证、RBAC、字典、系统管理（含初始化与重置向导）、文件管理。
  // 2026-10-23 同步（立项闭环）：①项目立项（8 接口）全链路收口并可演示——草稿 CRUD / 提交审批
  //   (submit，含重新提交先终结旧实例) / 审批通过 / 驳回退回到指定节点 / 签约(sign) / 审批时间线
  //   (timeline) / 已设计模式化引擎门面(WorkflowEngineService)；2026-10-22 经云效 run#55 上生产。
  // ②审批管理（立项部分）：待我审批 / 我发起的 / 我审批的 三 Tab 齐备，claim 补处理人、
  //   驳回 moveTo、通知去重(dedup_key)、操作审计均已落地。
  // ③同日补强：发起类数据行级隔离（非 ROLE_ADMIN 只看自己发起的，admin 无条件放行）、
  //   立项列表新增「项目编号」模糊查询、顶栏铃铛/帮助图标调序、全站查询区下拉宽度收编至 200px 规范。
  // ⚠️ 已知遗留（不影响主线，待排期）：BPMN 网关化 skipNodeIds 未做（驳回后重审会重走已批节点）；
  //   ROLE 候选组的通知 receivers 未按角色解析到具体用户。
  // 2026-10-24 同步（发货闭环收口）：①发货流程（Phase 2）全链路完成——创建即发起审批、
  //   审批中心「详情+审批」合一工作台（当前审批面板/审批进度折叠/审批结果与驳回）、
  //   审批通过通知申请人（链接直达发货管理页，数据隔离口径）、标记已发货、标记客户收货
  //   （支持部分收货后续收：SHIPPED/PARTIAL_RECEIVED 双态放行，应收单金额按累计已收重算）、
  //   申请人撤回、编辑入口按 approval_status=APPROVED 隐藏（V57 迁移新增该列）。
  // ②审批管理范围扩展：由「立项部分」扩为「立项/发货」，待我审批/我发起的/我审批的三 Tab
  //   双业务线通用（按流程 key 分发立项/发货两套 API）。
  // ③应收单：收货联动生成 + 部分收货续收重算已落地 → 进行中；核销/开票链路仍待开发。
  // ④货物明细：发货占用/剩余可发预校验已接入；2026-10-26 二次确认升「已完成」（暂不再维护、不影响业务流转，按完成计）。
  // 财务业务域其余（收款/开票/核销/退货/看板）仍待开发，保持待开发状态。
  //   ↑ 此结论已于 2026-10-26 被代码核实推翻（见下方 ③）：上述五模块实际已全栈落地，更正为已完成。
  // 2026-10-26 同步（一致性收口 + 日志字典修复 + 进度清单对齐）：
  // ① 空数据兜底全站统一：新增共享组件 src/components/EmptyState.vue（封装 el-empty，默认「暂无数据」/imageSize=80，与退货页基准一致）。
  //   全站 34 个含 el-table 的列表页由纯文字「暂无数据」统一为有图标的空态风格（发货/发票/收款/项目/文件/日志/系统管理等皆覆盖）；
  //   各页原有语义文案保留（如 process 节点表「尚未配置节点」、writeoff 差异池「没有待配平的差异」）。
  //   退货页原本裸用 <el-empty> 也收敛为共享组件，实现单源；三个明细弹窗（Project/Return/Shipment DetailDialog）内 ApprovalTimeline 的
  //   审批进度空态原样保留、未误伤。vue-tsc --noEmit 两次均零报错；前端改动仍在工作区未提交。
  // ② 操作日志「目标类型」字典枚举补齐（图3 对不齐的根因）：后端 @Auditable 真实落库 10 个目标类型
  //   （USER/ROLE/MENU/DICT_TYPE/DICT_DATA/FILE/INVOICE/APPROVAL/RECEIPT/PROJECT），字典 audit_target_type 仅 V22 种 6 项，
  //   缺 INVOICE/APPROVAL/RECEIPT/PROJECT（发票/审批/收款/项目）→ 表格回退显示原始英文、下拉筛不到。
  //   新增 V69 迁移幂等补齐 4 项（列序与 V22 逐字段一致），同步 DatabaseCheckService 字典计数 140→144（dictTypeCount 保持 33），
  //   修正前端 operation.vue 过期注释「6 项 → 共 10 项」。后端改动未起服验证（Flyway 应用启动执行）。
  // ③ 进度清单与实际代码对齐（即"同步"本应做的核心动作，此前漏做）：逐模块核实前后端代码后，
  //    收款/开票/核销/退货/看板 五模块前后端+实体+Mapper 已全栈落地（且 10-26 空状态改造时这些页面已有真实内容），
  //    故由「待开发」更正为「已完成」；应收单（list+详情弹窗+后端全套）由「进行中」升「已完成」。
  //    6 项新增/改写已完成状态已同步进 DEFAULT_STATE 并登记 FORCE_KEYS（覆盖老用户 localStorage 旧值）；
  //    货物明细经二次确认（2026-10-26）由「进行中」升「已完成」——巴比明确：暂不再维护、不影响业务流转，按完成计。
  //    更正后 15 / 15 全部完成。
  // ④ 核心业务流程状态字典样式补全（V70 迁移，趁 V69 尚未跑、DB 未锁定前落地）：复盘立项→审批→发货→应收→收款→开票→核销→退货
  //    全链路，发现 receivable_status / invoice_status(老三条) / writeoff_status / return_execute_status 四个状态字典在 V2 种子漏带 style 列，
  //    前端恒为 NULL→el-tag 兜底全灰、不醒目、无提醒作用。V70 按既有语义（warning=橙·待办提醒 / primary=蓝·进行中 /
  //    success=绿·终态 / danger=红·异常）幂等 UPDATE 配色；已带 style 的 receipt_status 等不覆盖。纯 UPDATE 不动计数。
  const DEFAULT_STATE = {
    '0|认证模块': 2,
    '0|RBAC 权限管理': 2,
    '0|字典管理': 2,
    '3|系统管理': 2,
    '3|文件管理': 2,
    '1|项目立项': 2,
    '1|审批管理（立项/发货）': 2,
    '1|货物明细': 2,
    '2|发货流程': 2,
    '2|应收单': 2,
    '2|收款流程': 2,
    '2|开票流程': 2,
    '2|核销机制': 2,
    '3|退货流程': 2,
    '3|数据看板': 2
  };
  // ⚠️ 基线更新必须登记的 key：localStorage 一旦写入就由用户状态优先，DEFAULT_STATE 的增量不会自动显现。
  //    每次往 DEFAULT_STATE 里新增/改写「已完成」模块，务必把对应 key 加到这里，否则已点过本页的用户
  //    刷新后仍看到旧值。（只覆盖这里列出的 key，用户手工调过的其余模块状态不受影响）
  const FORCE_KEYS = [
    '1|项目立项',
    '1|审批管理（立项/发货）',
    '1|货物明细',
    '2|发货流程',
    '2|应收单',
    '2|收款流程',
    '2|开票流程',
    '2|核销机制',
    '3|退货流程',
    '3|数据看板'
  ];
  function loadState() {
    let stored = {};
    try { stored = JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { stored = {}; }
    const s = Object.assign({}, DEFAULT_STATE, stored);
    FORCE_KEYS.forEach(k => { s[k] = DEFAULT_STATE[k]; });
    return s;
  }
  function saveState(s) { localStorage.setItem(STORE_KEY, JSON.stringify(s)); }

  let state = loadState();
  const phasesEl = document.getElementById('phases');

  phases.forEach(p => {
    const card = document.createElement('div');
    card.className = 'phase';
    const totalApis = p.modules.reduce((a, m) => a + m.apis, 0);
    card.innerHTML = '<h2>' + p.title + '</h2><div class="pmeta">' + p.desc + ' · 共 ' + totalApis + ' 个接口</div>';
    p.modules.forEach(m => {
      const key = p.key + '|' + m.name;
      const cur = state[key] || 0;
      const row = document.createElement('div');
      row.className = 'item';
      row.dataset.key = key;
      row.innerHTML =
        '<div class="chk ' + STATE[cur] + '">' + (cur === 2 ? '✓' : (cur === 1 ? '…' : '')) + '</div>' +
        '<div class="name">' + m.name + '</div>' +
        '<div class="apis">' + m.apis + ' 个接口</div>' +
        '<div class="badge ' + STATE[cur] + '">' + STATE_TXT[cur] + '</div>';
      row.addEventListener('click', () => {
        const next = (state[key] || 0) + 1;
        state[key] = next > 2 ? 0 : next;
        saveState(state);
        render();
      });
      card.appendChild(row);
    });
    phasesEl.appendChild(card);
  });

  function render() {
    let done = 0, total = 0;
    document.querySelectorAll('.item').forEach(row => {
      const key = row.dataset.key;
      const cur = state[key] || 0;
      total++;
      if (cur === 2) done++;
      const chk = row.querySelector('.chk');
      const badge = row.querySelector('.badge');
      chk.className = 'chk ' + STATE[cur];
      chk.textContent = cur === 2 ? '✓' : (cur === 1 ? '…' : '');
      badge.className = 'badge ' + STATE[cur];
      badge.textContent = STATE_TXT[cur];
    });
    document.getElementById('doneCount').textContent = done + ' / ' + total;
    document.getElementById('barFill').style.width = (done / total * 100) + '%';
  }

  document.getElementById('resetBtn').addEventListener('click', () => {
    if (confirm('确定重置所有勾选状态？')) { state = {}; saveState(state); render(); }
  });

  render();
</script>
</body>
</html>
